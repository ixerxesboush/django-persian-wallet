{% extends 'base.html' %}

{% block title %}واریز{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">واریز به کیف پول</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field.errors }}{{ field }}
                        </div>
                    {% endfor %}
                    <small class="text-muted">مبلغ را به تومان وارد کنید.</small>
                    <button type="submit" class="btn btn-success w-100 mt-3">واریز</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
